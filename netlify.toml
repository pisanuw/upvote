[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  # AUTH_SMTP_USER is the SMTP user name, not a secret, and its value is an
  # ordinary word that the sign-in code uses in its own names, so Netlify's
  # secret scan stopped the build on it. The scan still covers every other
  # secret variable, AUTH_SMTP_PASS included.
  SECRETS_SCAN_OMIT_KEYS = "AUTH_SMTP_USER"

[[plugins]]
  package = "@netlify/plugin-nextjs"
# The primary address is upvoteme.hintwise.org (NEXTAUTH_URL). Send the old
# netlify.app address there so a sign-in never starts on one host and returns
# to the other (its cookies would be on the wrong host). Deploy previews use
# other hosts and are not affected.
[[redirects]]
  from = "https://upvoteme.netlify.app/*"
  to = "https://upvoteme.hintwise.org/:splat"
  status = 301
  force = true
